name: Production IaC and Application Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  infrastructure-and-deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4

      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Authenticate with AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # Provision all underlying architecture, load balancing routing, and SSL verification layers in a single pass
      - name: Provision Core Infrastructure Layers
        run: |
          terraform init
          terraform import aws_db_subnet_group.db_subnets crypto-db-subnet-group || true
          terraform apply -auto-approve
        env:
          TF_VAR_root_domain_name: ${{ secrets.MY_ROOT_DOMAIN }}
          TF_VAR_app_subdomain_name: ${{ secrets.MY_SUBDOMAIN }}

      # Build and push steps
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Execute Managed Docker Build and Image Push
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO_NAME="crypto-prediction-app"
          TARGET_URL="$ECR_REGISTRY/$REPO_NAME:latest"

          # Build container using standard rules
          docker build -t $REPO_NAME:latest .

          # Tag and push container directly into your infrastructure repository
          docker tag $REPO_NAME:latest $TARGET_URL
          docker push $TARGET_URL

      # Force ECS Fargate cluster tasks to download and launch the new image deployment layer
      - name: Force Deploy Application Update to ECS Cluster
        run: |
          aws ecs update-service \
            --cluster crypto-production-cluster \
            --service crypto-prediction-service \
            --force-new-deployment
